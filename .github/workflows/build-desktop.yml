name: Build Desktop App

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Portable Zip & Windows Installer
        run: .\gradlew.bat --no-daemon --console=plain :desktop:packagePortableZip :desktop:packageExe

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribidoo-Portable-Windows
          path: dist/Scribidoo-Portable.zip
          retention-days: 30

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribidoo-Installer-Windows
          path: desktop/build/compose/binaries/main/exe/*.exe
          retention-days: 30

      - name: Create Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Scribidoo-Portable.zip
            desktop/build/compose/binaries/main/exe/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
